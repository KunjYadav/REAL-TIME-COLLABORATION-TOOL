<svg width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Terminal Window -->
  <rect x="2" y="4" width="20" height="16" rx="2.5" stroke="#475569" stroke-width="2"/>
  
  <!-- Top Bar / Window Header -->
  <path d="M2 9H22" stroke="#475569" stroke-width="2"/>
  
  <!-- Window Control Dots (Subtle) -->
  <circle cx="5" cy="6.5" r="1" fill="#64748B"/>
  <circle cx="8" cy="6.5" r="1" fill="#64748B"/>
  
  <!-- Live Sync Connection Path (Purple) -->
  <path d="M12 13C12 13 13.5 11 16 11C18.5 11 20 13 20 13" stroke="#A855F7" stroke-width="1.5" stroke-linecap="round">
    <animate attributeName="stroke-opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
  </path>

  <!-- The Code Prompt (Neon Cyan) -->
  <path d="M6 13L8.5 15.5L6 18" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Blinking Sync Cursor -->
  <line x1="10" y1="18" x2="14" y2="18" stroke="#22D3EE" stroke-width="2" stroke-linecap="round">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
  </line>
  
  <!-- Connectivity Indicator -->
  <circle cx="20" cy="18" r="1.5" fill="#22D3EE">
    <animate attributeName="fill" values="#22D3EE;#A855F7;#22D3EE" dur="3s" repeatCount="indefinite" />
  </circle>
</svg>
